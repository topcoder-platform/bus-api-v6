packages:
  - '.'

# The service intentionally consumes tc-core-library-js from GitHub.
blockExoticSubdeps: false
autoInstallPeers: false

overrides:
  axios: 1.18.1
  'brace-expansion@^1': 1.1.18
  'brace-expansion@^2': 2.1.4
  'brace-expansion@^5': 5.0.9
  'fast-uri@^3': 4.1.2
  'file-type@>=13.0.0 <21.3.2': 21.3.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  'js-yaml@^3': 3.15.1
  'js-yaml@^4': 4.3.1
  'js-yaml@^5': 5.2.2
  lodash: 4.18.1
  'minimatch@<3.1.4': 3.1.4
  multer: 2.2.0
  path-to-regexp: 8.4.2
  qs: 6.15.3

allowBuilds:
  '@nestjs/core@11.1.28': false
  '@scarf/scarf@1.4.0': false
  '@swc/core@1.15.43': true
  'dtrace-provider@0.8.8': false
  'unrs-resolver@1.12.2': true
